<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONİWEB MATEMATİK | OYUN</title>
    <style>
        body { background: #0f172a; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        canvas { background: #1e293b; border-bottom: 5px solid #38bdf8; display: block; margin: 20px auto; max-width: 100%; height: auto; }
        .ui-layer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 320px; background: rgba(15, 23, 42, 0.9); padding: 20px; border-radius: 15px; border: 2px solid #38bdf8; }
        .btn { background: #4ade80; color: #0f172a; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 20px; margin-top: 10px; }
        #score { font-size: 24px; margin-top: 10px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div id="score">Skor: 0</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="menu" class="ui-layer">
        <h1 id="title">ONİWEB MATEMATİK</h1>
        <p id="desc">Geometrik şekillerin üzerinden atla!</p>
        <button class="btn" onclick="startGame()" ontouchstart="startGame()">İŞLEME BAŞLA</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const menu = document.getElementById("menu");
        const title = document.getElementById("title");
        const desc = document.getElementById("desc");

        let score = 0;
        let gameRunning = false;
        let player = { x: 50, y: 310, w: 45, h: 45, dy: 0, jumpForce: 12, gravity: 0.6, grounded: false };
        let obstacle = { x: 800, y: 310, w: 40, h: 40, speed: 7, type: 'kare' };

        function drawPlayer() {
            // Mavi Karakter
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            // Üzerine küçük bir artı işareti (+)
            ctx.fillStyle = "white";
            ctx.font = "bold 20px Arial";
            ctx.fillText("+", player.x + 15, player.y + 30);
        }

        function drawObstacle() {
            ctx.fillStyle = "#ff5252";
            // Kırmızı Engel (Üçgen veya Kare olarak değişir)
            if (score % 2 === 0) {
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
            } else {
                ctx.beginPath();
                ctx.moveTo(obstacle.x, obstacle.y + 40);
                ctx.lineTo(obstacle.x + 20, obstacle.y);
                ctx.lineTo(obstacle.x + 40, obstacle.y + 40);
                ctx.fill();
            }
        }

        function update() {
            if (!gameRunning) return;

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > 310) {
                player.y = 310;
                player.dy = 0;
                player.grounded = true;
            }

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -40) {
                obstacle.x = 800 + Math.random() * 300;
                score++;
                scoreElement.innerText = "Skor: " + score;
                obstacle.speed += 0.2;
            }

            // Çarpışma Kontrolü
            if (player.x < obstacle.x + 35 &&
                player.x + 35 > obstacle.x &&
                player.y + 35 > obstacle.y) {
                gameOver();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlayer();
            drawObstacle();
            requestAnimationFrame(update);
        }

        function startGame() {
            if(gameRunning) return;
            score = 0;
            obstacle.speed = 7;
            obstacle.x = 800;
            player.y = 310;
            gameRunning = true;
            menu.style.display = "none";
            scoreElement.innerText = "Skor: 0";
            update();
        }

        function gameOver() {
            gameRunning = false;
            menu.style.display = "block";
            title.innerText = "HESAP HATASI!";
            desc.innerText = "Şekillere çarpmadan devam etmelisin.";
            document.querySelector(".btn").innerText = "TEKRAR ÇÖZ";
        }

        function jump() {
            if (player.grounded && gameRunning) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") jump();
        });

        window.addEventListener("touchstart", (e) => {
            if (gameRunning) {
                jump();
                if (e.target === canvas) e.preventDefault();
            }
        }, { passive: false });

    </script>
</body>
</html>
